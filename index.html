<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Handy Logger</title>
<link rel="icon" type="image/png" href="favicon-handylogger.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roast Logger">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.0.1"></script>
<script src="vendor/hammer.min.js"></script>
<script src="roast-logic.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>ROAST LOGGER</h1>
    <button id="profileToggleBtn" aria-label="Settings">⚙️ Settings</button>
</header>

<div id="historyViewerBanner" class="history-viewer-banner" hidden>
    <div class="history-viewer-copy">
        <span class="history-viewer-label">Past Log</span>
        <span id="historyViewerTitle" class="history-viewer-title">Untitled roast</span>
        <span id="historyViewerMeta" class="history-viewer-meta">--/-- --:-- · 0m00s</span>
    </div>
    <button id="historyExitViewerBtn" class="history-viewer-exit" type="button">New Roast</button>
</div>

<div id="historyScrim" class="history-scrim" hidden></div>
<div id="historyEdgeHandle" class="history-edge-handle" aria-hidden="true"></div>
<aside id="historyPanel" class="history-panel" aria-label="Past Logs" aria-hidden="true">
    <div class="history-header">
        <h2>Past Logs</h2>
        <button id="historyImportBtn" class="history-import-btn" type="button">Import CSV</button>
        <button id="historyCollapseBtn" class="panel-collapse-btn history-collapse-btn" type="button" aria-label="Collapse past logs">‹</button>
        <input id="historyImportInput" type="file" accept=".csv,text/csv" hidden>
    </div>
    <button id="historyCompareToggle" class="history-compare-toggle" type="button">
        <span>Compare</span>
        <span class="history-toggle-pill" aria-hidden="true"></span>
    </button>
    <div id="historyList" class="history-list"></div>
</aside>

<div id="profileEditor">
    <div class="modal-content">
        <div class="settings-desktop-header">
            <h3>Settings</h3>
            <button id="settingsCollapseBtn" class="panel-collapse-btn settings-collapse-btn" type="button" aria-label="Collapse settings">›</button>
        </div>
        <div class="settings-tabs" role="tablist" aria-label="Settings sections">
            <span class="settings-tab-indicator" aria-hidden="true"></span>
            <button class="settings-tab is-active" type="button" id="profileTabBtn" data-panel="profilePanel" role="tab" aria-selected="true">Profile</button>
            <button class="settings-tab" type="button" id="beanTabBtn" data-panel="beanPanel" role="tab" aria-selected="false">Bean</button>
            <button class="settings-tab" type="button" id="cueTabBtn" data-panel="cuePanel" role="tab" aria-selected="false">Cue</button>
        </div>

        <section id="profilePanel" class="settings-panel" role="tabpanel" aria-labelledby="profileTabBtn">
            <div class="profile-list" id="profileList" aria-label="Profiles"></div>
            <span class="profile-hint">名前はそのまま編集。左スワイプで削除、長押しで複製。</span>
            <div class="prof-row-list" id="profileRowList"></div>
        </section>

        <section id="beanPanel" class="settings-panel" role="tabpanel" aria-labelledby="beanTabBtn" hidden>
            <div class="settings-field">
                <label class="settings-label" for="beanNameInput">Bean Name</label>
                <input id="beanNameInput" class="settings-input" type="text" autocomplete="off" placeholder="Ethiopia Chelbesa Washed" aria-label="Bean name">
            </div>
            <div class="bean-suggestion-groups" aria-label="Bean name suggestions">
                <div class="bean-suggestion-group" aria-label="Origin suggestions">
                    <button class="bean-chip" type="button" data-bean-suggestion="Ethiopia">Ethiopia</button>
                    <button class="bean-chip" type="button" data-bean-suggestion="Kenya">Kenya</button>
                    <button class="bean-chip" type="button" data-bean-suggestion="Tanzania">Tanzania</button>
                    <button class="bean-chip" type="button" data-bean-suggestion="Rwanda">Rwanda</button>
                    <button class="bean-chip" type="button" data-bean-suggestion="Colombia">Colombia</button>
                    <button class="bean-chip" type="button" data-bean-suggestion="Guatemala">Guatemala</button>
                    <button class="bean-chip" type="button" data-bean-suggestion="Costa Rica">Costa Rica</button>
                    <button class="bean-chip" type="button" data-bean-suggestion="Honduras">Honduras</button>
                    <button class="bean-chip" type="button" data-bean-suggestion="El Salvador">El Salvador</button>
                    <button class="bean-chip" type="button" data-bean-suggestion="Panama">Panama</button>
                </div>
                <div class="bean-suggestion-group" aria-label="Process suggestions">
                    <button class="bean-chip process" type="button" data-bean-suggestion="Washed">Washed</button>
                    <button class="bean-chip process" type="button" data-bean-suggestion="Natural">Natural</button>
                    <button class="bean-chip process" type="button" data-bean-suggestion="Honey">Honey</button>
                    <button class="bean-chip process" type="button" data-bean-suggestion="Anaerobic">Anaerobic</button>
                </div>
            </div>
            <div class="settings-field">
                <label class="settings-label" for="beanNoteInput">Note</label>
                <textarea id="beanNoteInput" class="settings-textarea" placeholder="バッチナンバー / 収穫年 / 焙煎の狙い / 天気温湿度" aria-label="Roast note"></textarea>
            </div>
        </section>

        <section id="cuePanel" class="settings-panel" role="tabpanel" aria-labelledby="cueTabBtn" hidden>
            <div class="settings-list">
                <label class="settings-row" for="beepEnabledInput">
                    <span class="settings-row-text">
                        <span class="settings-row-title">Beep</span>
                        <span class="settings-row-meta" id="beepSupportText">記録間隔ごとの音</span>
                    </span>
                    <input id="beepEnabledInput" class="settings-toggle" type="checkbox">
                </label>
                <label class="settings-row" for="cueIntervalInput">
                    <span class="settings-row-text">
                        <span class="settings-row-title">Interval</span>
                        <span class="settings-row-meta">Cue間隔。記録は最寄り5秒へ丸めます</span>
                    </span>
                    <select id="cueIntervalInput" class="settings-select" aria-label="Recording and cue interval">
                        <option value="10">10 sec</option>
                        <option value="15">15 sec</option>
                    </select>
                </label>
                <label class="settings-row" for="hapticEnabledInput">
                    <span class="settings-row-text">
                        <span class="settings-row-title">Haptic</span>
                        <span class="settings-row-meta" id="hapticSupportText">記録間隔ごとの振動</span>
                    </span>
                    <input id="hapticEnabledInput" class="settings-toggle" type="checkbox">
                </label>
            </div>
            <button id="testCueBtn" type="button">Test Cue</button>
        </section>
    </div>
</div>

<div id="dashboard">
    <div class="stat-box">
        <span class="stat-label">TIME</span>
        <span class="stat-value" id="timerDisplay">00:00</span>
    </div>
    <div class="stat-box">
        <span class="stat-label">TEMP</span>
        <span class="stat-value" id="tempDisplay">---</span>
    </div>
    <div class="stat-box">
        <span class="stat-label">RoR</span>
        <span class="stat-value" id="rorDisplay">--.-</span>
    </div>
</div>

<div id="weightPanel">
    <div class="weight-grid">
        <label class="weight-field" for="greenWeightInput">
            <span class="weight-label">Green Beans</span>
            <span class="weight-input-wrap">
                <input id="greenWeightInput" class="weight-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="100.0" aria-label="Green beans weight in grams">
                <span class="weight-unit">g</span>
            </span>
        </label>
        <div id="postRoastFields" class="weight-post-roast" hidden>
            <label class="weight-field" for="roastedWeightInput">
                <span class="weight-label">Roasted Beans</span>
                <span class="weight-input-wrap">
                    <input id="roastedWeightInput" class="weight-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="84.0" disabled aria-label="Roasted beans weight in grams">
                    <span class="weight-unit">g</span>
                </span>
            </label>
            <div class="weight-summary">
                <span class="weight-summary-label">Weight Loss</span>
                <span class="weight-summary-value" id="weightLossDisplay">--.-%</span>
                <span class="weight-summary-meta" id="weightLossMeta">焙煎前の投入量を入れ、STOP後に焙煎後重量を入力してください。</span>
            </div>
        </div>
    </div>
</div>

<div id="canvas-container">
    <canvas id="roastChart"></canvas>
    <div id="chartReadout" class="chart-readout" aria-live="polite">
        <span id="chartReadoutTime" class="chart-readout-time">00<span class="chart-readout-time-separator">:</span>00</span>
        <span class="chart-readout-temp"><span id="chartReadoutTemp">---</span><span class="chart-readout-unit">℃</span></span>
    </div>
</div>

<div id="pointDeletePanel" class="point-delete-panel" hidden role="dialog" aria-label="Delete captured temperature point">
    <span class="point-delete-title">Captured point</span>
    <span class="point-delete-value" id="pointDeleteText">--:-- / --.-℃</span>
    <div class="point-delete-actions">
        <button id="cancelDeletePointBtn" type="button">Cancel</button>
        <button id="confirmDeletePointBtn" type="button">Delete point</button>
    </div>
</div>

<button id="logToggle">▼ Show Console Log</button>
<div id="log"></div>

<div id="actionUI">
    <button id="mainActionBtn" class="btn-start" aria-label="Start roast">
        <svg id="btnIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span id="btnText">START</span>
    </button>
    <div id="crackInfo" hidden>
        <div class="crack-info-box">
            <span class="crack-info-label">CRACK TIME</span>
            <span class="crack-info-val" id="crackTimeBottom">--:--</span>
        </div>
        <div class="crack-info-box">
            <span class="crack-info-label">DEVELOP RISE</span>
            <span class="crack-info-val" id="crackTempRise">--.-</span>
        </div>
    </div>
</div>

<script>
    let referenceProfile = [];
    const profileCacheVersion = '2026-06-default-v1';
    const profileLibraryCacheVersion = '2026-06-profile-library-v1';
    const profileLibraryKey = 'roastProfileLibrary';
    const profileLibraryVersionKey = 'roastProfileLibraryVersion';
    const activeProfileKey = 'activeRoastProfileId';
    const beanMetadataKey = 'roastBeanMetadata';
    const roastHistoryKey = 'roastHistory';
    const defaultProfileInputs = ['150', '80', '105', '128', '149', '167', '182', '194', '202', '206', '209', '', '', '', '', ''];
    const maxProfileMinute = 15;
    let profileLibrary = [];
    let activeProfileId = '';
    let roastHistory = [];
    let selectedHistoryIds = [];
    let historyCompareMode = false;
    let historySwipeStart = null;
    let historyViewerEntryId = '';

    function getProfileInputs() {
        return Array.from(document.querySelectorAll('.prof-input'));
    }

    function getProfileInputValues() {
        return getProfileInputs().map((input) => input.value);
    }

    function createProfileId() {
        return `profile-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    function createDefaultProfile(name = 'Default') {
        return {
            id: createProfileId(),
            name,
            inputs: normalizeProfileInputs(defaultProfileInputs)
        };
    }

    function readJsonStorage(key) {
        try {
            return JSON.parse(localStorage.getItem(key));
        } catch (error) {
            return null;
        }
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function loadProfileLibrary() {
        const savedVersion = localStorage.getItem(profileLibraryVersionKey);
        const savedLibrary = readJsonStorage(profileLibraryKey);
        if (savedVersion === profileLibraryCacheVersion && Array.isArray(savedLibrary) && savedLibrary.length > 0) {
            const profiles = savedLibrary
                .filter((profile) => profile && profile.id)
                .map((profile) => ({
                    id: profile.id,
                    name: profile.name || 'Untitled',
                    inputs: normalizeProfileInputs(profile.inputs)
                }));
            if (profiles.length > 0) {
                return profiles;
            }
        }

        const legacyInputs = readJsonStorage('roastProfileCache');
        const legacyVersion = localStorage.getItem('roastProfileCacheVersion');
        const migratedProfile = legacyVersion === profileCacheVersion && Array.isArray(legacyInputs)
            ? { id: createProfileId(), name: 'Default', inputs: normalizeProfileInputs(legacyInputs) }
            : createDefaultProfile();

        localStorage.setItem(profileLibraryVersionKey, profileLibraryCacheVersion);
        localStorage.setItem(profileLibraryKey, JSON.stringify([migratedProfile]));
        localStorage.setItem(activeProfileKey, migratedProfile.id);
        return [migratedProfile];
    }

    function saveProfileLibrary() {
        localStorage.setItem(profileLibraryVersionKey, profileLibraryCacheVersion);
        localStorage.setItem(profileLibraryKey, JSON.stringify(profileLibrary));
        localStorage.setItem(activeProfileKey, activeProfileId);
    }

    function getActiveProfile() {
        return profileLibrary.find((profile) => profile.id === activeProfileId) || profileLibrary[0];
    }

    function setProfileInputs(values) {
        const normalized = normalizeProfileInputs(values);
        getProfileInputs().forEach((input, index) => {
            input.value = normalized[index] || '';
        });
        updateProfileRowVisibility();
    }

    function applyProfilePaste(text, startIndex) {
        const parsed = parseProfilePasteText(text, startIndex);
        if (parsed.appliedRows === 0 && parsed.invalidRows.length === 0) {
            return false;
        }

        setProfileInputs(parsed.values);
        saveEditorProfile();

        if (parsed.invalidRows.length > 0) {
            addLog(0, `⚠️ Profile paste skipped ${parsed.invalidRows.length} invalid row(s)`);
            window.alert(`読み込めない行をスキップしました:\n${parsed.invalidRows.slice(0, 5).join('\n')}`);
        }

        return true;
    }

    function renderProfileList() {
        const list = document.getElementById('profileList');
        list.innerHTML = '';

        profileLibrary.forEach((profile) => {
            const row = document.createElement('div');
            row.className = `profile-row${profile.id === activeProfileId ? ' is-active' : ''}`;
            row.setAttribute('data-profile-id', profile.id);
            row.innerHTML = `
                <button class="profile-delete-btn" type="button" aria-label="Delete ${escapeHtml(profile.name)}" aria-hidden="true" tabindex="-1">×</button>
                <div class="profile-row-body">
                    <input class="profile-name" type="text" value="${escapeHtml(profile.name)}" aria-label="Profile name">
                </div>
            `;
            list.appendChild(row);
            attachProfileRowBehavior(row, profile.id);
        });

        const createButton = document.createElement('button');
        createButton.id = 'createProfileBtn';
        createButton.className = 'profile-create-btn';
        createButton.type = 'button';
        createButton.textContent = '+ Create New';
        createButton.addEventListener('click', createProfile);
        list.appendChild(createButton);
    }

    function updateProfileListActiveState() {
        document.querySelectorAll('.profile-row').forEach((row) => {
            row.classList.toggle('is-active', row.getAttribute('data-profile-id') === activeProfileId);
        });
    }

    function selectProfile(profileId, renderList = true) {
        if (!profileLibrary.some((profile) => profile.id === profileId)) {
            return;
        }
        activeProfileId = profileId;
        saveProfileLibrary();
        const activeProfile = getActiveProfile();
        if (activeProfile) {
            setProfileInputs(activeProfile.inputs);
        }
        if (renderList) {
            renderProfileList();
        } else {
            updateProfileListActiveState();
        }
        calculateAndApplyProfile();
    }

    function loadActiveProfileIntoEditor() {
        const activeProfile = getActiveProfile();
        if (!activeProfile) {
            return;
        }
        activeProfileId = activeProfile.id;
        setProfileInputs(activeProfile.inputs);
        renderProfileList();
    }

    function saveEditorProfile() {
        const inputs = normalizeProfileInputs(getProfileInputValues());
        const activeProfile = getActiveProfile();
        if (activeProfile) {
            activeProfile.inputs = inputs;
        }
        saveProfileLibrary();
        localStorage.setItem('roastProfileCache', JSON.stringify(inputs));
        localStorage.setItem('roastProfileCacheVersion', profileCacheVersion);
        calculateAndApplyProfile();
        return inputs;
    }

    function createProfile() {
        const profile = {
            id: createProfileId(),
            name: `Profile ${profileLibrary.length + 1}`,
            inputs: normalizeProfileInputs([])
        };
        profileLibrary.push(profile);
        activeProfileId = profile.id;
        saveProfileLibrary();
        loadActiveProfileIntoEditor();
        calculateAndApplyProfile();
    }

    function duplicateProfile(profileId) {
        const sourceProfile = profileLibrary.find((profile) => profile.id === profileId);
        if (!sourceProfile) {
            return;
        }
        const profile = {
            id: createProfileId(),
            name: `${sourceProfile.name} Copy`,
            inputs: normalizeProfileInputs(sourceProfile.inputs)
        };
        profileLibrary.push(profile);
        activeProfileId = profile.id;
        saveProfileLibrary();
        loadActiveProfileIntoEditor();
        calculateAndApplyProfile();
    }

    function deleteProfile(profileId, animatedRow = null) {
        if (profileLibrary.length <= 1) {
            return;
        }
        const applyDelete = () => {
            profileLibrary = profileLibrary.filter((profile) => profile.id !== profileId);
            if (activeProfileId === profileId) {
                activeProfileId = profileLibrary[0].id;
                setProfileInputs(profileLibrary[0].inputs);
                calculateAndApplyProfile();
            }
            saveProfileLibrary();
            renderProfileList();
        };

        if (animatedRow && !animatedRow.classList.contains('is-deleting')) {
            animatedRow.classList.add('is-deleting');
            window.setTimeout(applyDelete, 280);
            return;
        }

        applyDelete();
    }

    function setProfileRowDeleteState(row, deleteButton, isOpen) {
        row.classList.toggle('is-delete-open', isOpen);
        row.classList.remove('is-swiping');
        row.style.setProperty('--profile-row-offset', isOpen ? '-58px' : '0px');
        row.style.setProperty('--profile-delete-opacity', isOpen ? '1' : '0');
        deleteButton.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
        deleteButton.tabIndex = isOpen ? 0 : -1;
    }

    function setProfileRowDragOffset(row, offset) {
        const clampedOffset = Math.min(0, Math.max(-72, offset));
        const deleteProgress = Math.min(Math.abs(clampedOffset) / 58, 1);
        row.classList.add('is-swiping');
        row.classList.remove('is-delete-open');
        row.style.setProperty('--profile-row-offset', `${clampedOffset}px`);
        row.style.setProperty('--profile-delete-opacity', `${deleteProgress}`);
    }

    function closeOtherProfileRows(currentRow) {
        document.querySelectorAll('.profile-row.is-delete-open').forEach((row) => {
            if (row === currentRow) {
                return;
            }
            const deleteButton = row.querySelector('.profile-delete-btn');
            if (deleteButton) {
                setProfileRowDeleteState(row, deleteButton, false);
            }
        });
    }

    function getProfilePanOffset(row, deltaX) {
        const startOffset = row.classList.contains('is-delete-open') ? -58 : 0;
        const rawOffset = startOffset + deltaX;
        if (rawOffset > 0) {
            return rawOffset * 0.18;
        }
        if (rawOffset < -72) {
            return -72 + (rawOffset + 72) * 0.16;
        }
        return rawOffset;
    }

    function attachHammerProfileRowBehavior(row, body, deleteButton, profileId, state) {
        if (!window.Hammer) {
            return false;
        }

        const manager = new Hammer.Manager(body, { touchAction: 'pan-y' });
        manager.add(new Hammer.Pan({ direction: Hammer.DIRECTION_HORIZONTAL, threshold: 2 }));
        manager.add(new Hammer.Press({ time: 650, threshold: 8 }));

        manager.on('press', () => {
            state.didLongPress = true;
            duplicateProfile(profileId);
        });

        manager.on('panstart', () => {
            if (profileLibrary.length <= 1) {
                return;
            }
            state.didPan = true;
            state.latestOffset = row.classList.contains('is-delete-open') ? -58 : 0;
            closeOtherProfileRows(row);
        });

        manager.on('panmove', (event) => {
            if (profileLibrary.length <= 1 || Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
                return;
            }
            state.latestOffset = getProfilePanOffset(row, event.deltaX);
            setProfileRowDragOffset(row, state.latestOffset);
        });

        manager.on('panend pancancel', (event) => {
            if (!state.didPan) {
                return;
            }
            const shouldOpen = state.latestOffset < -32 || event.velocityX < -0.35;
            const shouldClose = event.velocityX > 0.25 || state.latestOffset > -26;
            setProfileRowDeleteState(row, deleteButton, shouldOpen && !shouldClose);
            window.setTimeout(() => {
                state.didPan = false;
            }, 0);
        });

        return true;
    }

    function attachFallbackProfileRowBehavior(row, body, deleteButton, profileId, state) {
        let pointerStartX = 0;
        let pointerStartY = 0;
        let longPressTimer = null;

        const clearLongPress = () => {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        };

        body.addEventListener('pointerdown', (event) => {
            pointerStartX = event.clientX;
            pointerStartY = event.clientY;
            state.didLongPress = false;
            state.didPan = false;
            state.latestOffset = row.classList.contains('is-delete-open') ? -58 : 0;
            clearLongPress();
            longPressTimer = setTimeout(() => {
                state.didLongPress = true;
                duplicateProfile(profileId);
            }, 650);
        });

        body.addEventListener('pointermove', (event) => {
            const deltaX = event.clientX - pointerStartX;
            const deltaY = event.clientY - pointerStartY;
            if (Math.abs(deltaX) > 8 || Math.abs(deltaY) > 8) {
                clearLongPress();
            }
            if (Math.abs(deltaY) > Math.abs(deltaX) || Math.abs(deltaX) < 4 || profileLibrary.length <= 1) {
                return;
            }
            state.didPan = true;
            closeOtherProfileRows(row);
            state.latestOffset = getProfilePanOffset(row, deltaX);
            setProfileRowDragOffset(row, state.latestOffset);
        });

        body.addEventListener('pointerup', () => {
            clearLongPress();
            if (!state.didPan) {
                return;
            }
            setProfileRowDeleteState(row, deleteButton, state.latestOffset < -32);
            window.setTimeout(() => {
                state.didPan = false;
            }, 0);
        });

        body.addEventListener('pointercancel', () => {
            clearLongPress();
            if (state.didPan) {
                setProfileRowDeleteState(row, deleteButton, false);
            }
            state.didPan = false;
        });
    }

    function attachProfileRowBehavior(row, profileId) {
        const body = row.querySelector('.profile-row-body');
        const nameInput = row.querySelector('.profile-name');
        const deleteButton = row.querySelector('.profile-delete-btn');
        const state = {
            didLongPress: false,
            didPan: false,
            latestOffset: 0
        };

        setProfileRowDeleteState(row, deleteButton, false);
        if (!attachHammerProfileRowBehavior(row, body, deleteButton, profileId, state)) {
            attachFallbackProfileRowBehavior(row, body, deleteButton, profileId, state);
        }

        body.addEventListener('click', (event) => {
            if (!state.didLongPress && !state.didPan && event.target !== nameInput) {
                selectProfile(profileId);
            }
        });

        nameInput.addEventListener('focus', () => {
            selectProfile(profileId, false);
        });

        nameInput.addEventListener('click', () => {
            selectProfile(profileId, false);
        });

        nameInput.addEventListener('input', () => {
            const profile = profileLibrary.find((item) => item.id === profileId);
            if (!profile) {
                return;
            }
            profile.name = nameInput.value.trim() || 'Untitled';
            saveProfileLibrary();
        });

        nameInput.addEventListener('blur', () => {
            const profile = profileLibrary.find((item) => item.id === profileId);
            if (profile) {
                nameInput.value = profile.name;
            }
            renderProfileList();
        });

        deleteButton.addEventListener('click', (event) => {
            event.stopPropagation();
            deleteProfile(profileId, row);
        });

    function calculateAndApplyProfile() {
        const points = [];
        getProfileInputs().forEach((input) => {
            if (input.value !== "") {
                points.push({
                    sec: parseInt(input.getAttribute('data-min'), 10) * 60,
                    temp: parseFloat(input.value)
                });
            }
        });

        referenceProfile = [];
        if (points.length >= 2) {
            points.sort((a, b) => a.sec - b.sec);
            const maxSec = points[points.length - 1].sec;

            for (let t = 0; t <= maxSec; t += dataInterval) {
                let p1 = points[0];
                let p2 = points[points.length - 1];
                for (let i = 0; i < points.length - 1; i++) {
                    if (t >= points[i].sec && t <= points[i + 1].sec) {
                        p1 = points[i];
                        p2 = points[i + 1];
                        break;
                    }
                }

                if (p1.sec === p2.sec) {
                    referenceProfile[t / dataInterval] = p1.temp;
                } else {
                    referenceProfile[t / dataInterval] = p1.temp + ((t - p1.sec) / (p2.sec - p1.sec)) * (p2.temp - p1.temp);
                }
            }
        }

        updateXAxisMax(currentSeconds);
        roastChart.data.datasets[0].data = referenceProfile;
        roastChart.update();
    }

    let settingsSwipeStart = null;

    function startSettingsSwipe() {
        settingsSwipeStart = {
            index: getActiveSettingsPanelIndex()
        };
    }

    function updateSettingsSwipe(deltaX, deltaY) {
        if (!settingsSwipeStart) {
            return;
        }
        if (Math.abs(deltaY) > Math.abs(deltaX) || Math.abs(deltaX) < 8) {
            return;
        }

        const startIndex = settingsSwipeStart.index;
        const direction = deltaX < 0 ? 1 : -1;
        const targetIndex = Math.min(settingsPanelOrder.length - 1, Math.max(0, startIndex + direction));
        const startMetrics = getSettingsTabMetrics(startIndex);
        const targetMetrics = getSettingsTabMetrics(targetIndex);
        if (!startMetrics || !targetMetrics) {
            return;
        }

        const progress = Math.min(Math.abs(deltaX) / Math.max(startMetrics.width * 0.9, 1), 1);
        const dampedProgress = targetIndex === startIndex ? progress * 0.18 : progress;
        const left = startMetrics.left + (targetMetrics.left - startMetrics.left) * dampedProgress;
        const width = startMetrics.width + (targetMetrics.width - startMetrics.width) * dampedProgress;
        moveSettingsIndicator(left, width, true);
    }

    function finishSettingsSwipe(deltaX, deltaY) {
        if (!settingsSwipeStart) {
            return;
        }
        const startIndex = settingsSwipeStart.index;
        settingsSwipeStart = null;
        settingsTabs.classList.remove('is-dragging');

        if (Math.abs(deltaX) < 70 || Math.abs(deltaY) > 45) {
            syncSettingsIndicator(startIndex);
            return;
        }

        const direction = deltaX < 0 ? 1 : -1;
        const nextIndex = Math.min(settingsPanelOrder.length - 1, Math.max(0, startIndex + direction));
        activateSettingsPanel(settingsPanelOrder[nextIndex]);
    }

        settingsTabs.addEventListener('mousedown', (event) => {

    function createBeepDataUrl() {
        const sampleRate = 22050;
        const durationSeconds = 0.12;
        const frameCount = Math.floor(sampleRate * durationSeconds);
        const channelCount = 1;
        const bytesPerSample = 2;
        const blockAlign = channelCount * bytesPerSample;
        const byteRate = sampleRate * blockAlign;
        const dataSize = frameCount * blockAlign;
        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);
        const writeString = (offset, value) => {
            for (let i = 0; i < value.length; i++) {
                view.setUint8(offset + i, value.charCodeAt(i));
            }
        };

        writeString(0, 'RIFF');
        view.setUint32(4, 36 + dataSize, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, channelCount, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, dataSize, true);

        for (let i = 0; i < frameCount; i++) {
            const time = i / sampleRate;
            const envelope = Math.exp(-18 * time);
            const sample = Math.sin(2 * Math.PI * 1760 * time) * envelope * 0.45;
            view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, sample)) * 32767, true);
        }

        let binary = '';
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return `data:audio/wav;base64,${btoa(binary)}`;
    }

    async function primeAudioOutput() {
        const context = getAudioContext();
        if (context && context.state === 'suspended') {
            try {
                await context.resume();
            } catch (error) {}
        }

        const audio = getBeepAudio();
        if (audio) {
            try {
                audio.muted = true;
                audio.currentTime = 0;
                await audio.play();
                audio.pause();
                audio.currentTime = 0;
                audio.muted = false;
                audioOutputPrimed = true;
            } catch (error) {}
        }

        if (context && context.state === 'running') {
            audioOutputPrimed = true;
        }
    }

    function playOscillatorBeep() {
        const context = getAudioContext();
        if (!context) {
            return;
        }
        if (context.state === 'suspended') {
            context.resume().catch(() => {});
        }
        const osc = context.createOscillator();
        const gain = context.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1760, context.currentTime);
        gain.gain.setValueAtTime(0.12, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, context.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(context.destination);
        osc.start();
        osc.stop(context.currentTime + 0.12);
    }

    async function playBeep() {
        if (audioOutputPrimed) {
            const audio = getBeepAudio();
            if (audio) {
                try {
                    audio.pause();
                    audio.currentTime = 0;
                    await audio.play();
                    return;
                } catch (error) {}
            }
        }
        playOscillatorBeep();
    }

        cueSettings = {

        };
        applyCueInterval(cueSettings.intervalSec);
        localStorage.setItem(cueSettingsKey, JSON.stringify(cueSettings));
        applyCueSettingsToUI();
    }

    function applyCueSettingsToUI() {
        const hapticSupported = supportsHapticCue();
        beepEnabledInput.checked = cueSettings.beep;
        cueIntervalInput.value = String(cueSettings.intervalSec);
        cueIntervalInput.disabled = isRoasting;
        beepSupportText.innerText = `${cueSettings.intervalSec}秒ごとの音`;
        hapticEnabledInput.checked = cueSettings.haptic && hapticSupported;
        hapticEnabledInput.disabled = !hapticSupported;
        hapticSupportText.innerText = hapticSupported ? `${cueSettings.intervalSec}秒ごとの振動` : 'このブラウザでは未対応';
    }

    function initializeCueSettings() {
        cueSettings = loadCueSettings();
        applyCueInterval(cueSettings.intervalSec);
        if (!supportsHapticCue()) {
            cueSettings.haptic = false;
        }
        applyCueSettingsToUI();
    }

    function getBeanMetadata() {
        return {
            beanName: beanNameInput.value.trim(),
            note: beanNoteInput.value.trim()
        };
    }

    function saveBeanMetadata() {
        localStorage.setItem(beanMetadataKey, JSON.stringify(getBeanMetadata()));
    }

    function initializeBeanMetadata() {
        const savedMetadata = readJsonStorage(beanMetadataKey) || {};
        beanNameInput.value = savedMetadata.beanName || '';
        beanNoteInput.value = savedMetadata.note || '';
    }

    function applyBeanSuggestion(suggestion) {
        const nextValue = appendUniqueSuggestion(beanNameInput.value, suggestion);
        if (nextValue !== beanNameInput.value) {
            beanNameInput.value = nextValue;
            saveBeanMetadata();
        }
        beanNameInput.focus();
    }

    function playHapticCue() {
        if (cueSettings.haptic && supportsHapticCue()) {
            navigator.vibrate([90]);
        }
    }

    async function playCue() {
        if (cueSettings.beep) {
            await playBeep();
        }
        playHapticCue();
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if (recognition) {
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript;
            const parsedTemp = parseRecognizedTemperature(transcript);
            if (parsedTemp !== null && roastPhase > 0 && roastPhase < 3) {
                const temp = parsedTemp.value;
                const targetTime = roundToDataSlot(getElapsedRoastSeconds());
                latestTargetTime = targetTime;
                const outlierCheck = detectOutlier(targetTime, temp);
                if (outlierCheck.isOutlier) {
                    dataQuality.rejectedOutliers++;
                    addLog(targetTime, `⚠️ Ignored ${temp}℃ (${outlierCheck.reason})`);
                    return;
                }
                processNewData(targetTime, temp);
                addLog(targetTime, `🎙️ ${temp}℃`);
            }
        };

        recognition.onerror = (event) => {
            addLog(Math.max(currentSeconds - 1, 0), `⚠️ 音声認識: ${event.error}`);
        };

        recognition.onend = () => {
            if (isRoasting) {
                try {
                    recognition.start();
                } catch (error) {
                    addLog(Math.max(currentSeconds - 1, 0), '⚠️ 音声認識の再開に失敗しました');
                }
            }
        };
    }

    function findPreviousValidIndex(startIndex) {
        for (let i = startIndex - 1; i >= 0; i--) {
            if (rawTemps[i] !== undefined && rawTemps[i] !== null) {
                return i;
            }
        }
        return -1;
    }

    function detectOutlier(targetTimeSec, newTemp) {
        if (!Number.isFinite(newTemp)) {
            return { isOutlier: true, reason: 'invalid number' };
        }

        if (newTemp < 0 || newTemp > 300) {
            return { isOutlier: true, reason: 'outside valid temperature range' };
        }

        const index = targetTimeSec / dataInterval;
        const previousIndex = findPreviousValidIndex(index);
        const targetTemp = referenceProfile[index];
        const reasons = [];
        let hardOutlierReason = '';

        if (previousIndex !== -1) {
            const previousTemp = rawTemps[previousIndex];
            const stepGap = Math.max(index - previousIndex, 1);
            const elapsedSeconds = Math.max(stepGap * dataInterval, dataInterval);
            const changePer10Sec = Math.abs(newTemp - previousTemp) * (10 / elapsedSeconds);
            const allowedStepChange = targetTimeSec <= 60 ? 90 : targetTimeSec <= 180 ? 40 : 22;
            if (changePer10Sec > allowedStepChange) {
                reasons.push(`jump ${changePer10Sec.toFixed(1)}C/10s`);
            }
            if (targetTimeSec > 120 && changePer10Sec > 70) {
                hardOutlierReason = `jump ${changePer10Sec.toFixed(1)}C/10s`;
            }
        }

        if (targetTemp !== undefined) {
            const deviationFromTarget = Math.abs(newTemp - targetTemp);
            const allowedTargetDeviation = targetTimeSec <= 60 ? 95 : targetTimeSec <= 180 ? 55 : 38;
            if (deviationFromTarget > allowedTargetDeviation) {
                reasons.push(`off target by ${deviationFromTarget.toFixed(1)}C`);
            }
            if (targetTimeSec > 120 && deviationFromTarget > 80) {
                hardOutlierReason = `off target by ${deviationFromTarget.toFixed(1)}C`;
            }
        }

        if (hardOutlierReason) {
            return { isOutlier: true, reason: hardOutlierReason };
        }

        if (reasons.length >= 2) {
            return { isOutlier: true, reason: reasons.join(', ') };
        }

        return { isOutlier: false, reason: '' };
    }

    function processNewData(targetTimeSec, newTemp) {
        const index = targetTimeSec / dataInterval;
        rawTemps[index] = newTemp;
        rebuildInterpolatedTemps();
        updateCrackInfo();
        roastChart.update();
    }

    function interpolateMissingData(currentIndex) {
        const lastValidIndex = findPreviousValidIndex(currentIndex);
        if (lastValidIndex !== -1 && currentIndex - lastValidIndex > 1) {
            const steps = currentIndex - lastValidIndex;
            const stepTemp = (rawTemps[currentIndex] - rawTemps[lastValidIndex]) / steps;
            for (let i = 1; i < steps; i++) {
                temps[lastValidIndex + i] = rawTemps[lastValidIndex] + (stepTemp * i);
            }
        }
    }

    function calculateRoR() {
        bottomTempIndex = findBottomTempIndex();
        for (let i = 0; i < rors.length; i++) {
            rors[i] = null;
        }

        if (bottomTempIndex === null) {
            rorDisplay.innerText = '--.-';
            return;
        }

        rors[bottomTempIndex] = 0;
        for (let i = bottomTempIndex + 1; i < temps.length; i++) {
            if (temps[i] !== undefined && temps[i] !== null && temps[i - 1] !== undefined && temps[i - 1] !== null) {
                rors[i] = (temps[i] - temps[i - 1]) * (60 / dataInterval);
            }
        }

        const latestValidRoR = rors.slice().reverse().find((value) => value !== undefined && value !== null);
        rorDisplay.innerText = latestValidRoR !== undefined ? latestValidRoR.toFixed(1) : '--.-';
    }

    function rebuildInterpolatedTemps() {
        const nextLength = Math.max(labels.length, rawTemps.length, temps.length);
        temps.length = nextLength;

        for (let i = 0; i < nextLength; i++) {
            const rawTemp = rawTemps[i];
            temps[i] = rawTemp !== undefined && rawTemp !== null && Number.isFinite(rawTemp) ? rawTemp : null;
        }

        const capturedPoints = rawTemps
            .map((temp, index) => ({ temp, index }))
            .filter((point) => point.temp !== undefined && point.temp !== null && Number.isFinite(point.temp));

        for (let pointIndex = 0; pointIndex < capturedPoints.length - 1; pointIndex++) {
            const startPoint = capturedPoints[pointIndex];
            const endPoint = capturedPoints[pointIndex + 1];
            const steps = endPoint.index - startPoint.index;
            if (steps <= 1) {
                continue;
            }

            const stepTemp = (endPoint.temp - startPoint.temp) / steps;
            for (let i = 1; i < steps; i++) {
                temps[startPoint.index + i] = startPoint.temp + (stepTemp * i);
            }
        }

        const latestPoint = capturedPoints[capturedPoints.length - 1] || null;
        latestRecordedTemp = latestPoint ? latestPoint.temp : null;
        tempDisplay.innerText = latestRecordedTemp !== null ? latestRecordedTemp.toFixed(1) : '---';
        calculateRoR();
    }

    function findBottomTempIndex() {
        const capturedPoints = rawTemps
            .map((temp, index) => ({ temp, index }))
            .filter((point) => point.temp !== undefined && point.temp !== null && Number.isFinite(point.temp));

        if (capturedPoints.length < 2) {
            return null;
        }

        let bottomPoint = capturedPoints[0];
        capturedPoints.forEach((point) => {
            if (point.temp < bottomPoint.temp) {
                bottomPoint = point;
            }
        });

        const hasRisingPointAfterBottom = capturedPoints.some((point) => point.index > bottomPoint.index && point.temp > bottomPoint.temp);
        return hasRisingPointAfterBottom ? bottomPoint.index : null;
    }

    function updateCrackInfo() {
        if (crackSeconds !== null) {
            const elapsed = Math.max((roastStopSeconds ?? currentSeconds) - crackSeconds, 0);
            crackTimeBottom.innerText = formatTime(elapsed);
            if (crackTemp !== null && latestRecordedTemp !== null) {
                const rise = latestRecordedTemp - crackTemp;
                crackTempRise.innerText = `${rise > 0 ? '+' : ''}${rise.toFixed(1)}`;
            }
        }
    }

    function formatTime(seconds) {
        const safeSeconds = Math.max(0, Math.round(seconds));
        return `${Math.floor(safeSeconds / 60).toString().padStart(2, '0')}:${(safeSeconds % 60).toString().padStart(2, '0')}`;
    }

    function formatTimeWithLightSeparator(seconds) {
        return formatTime(seconds).replace(':', '<span class="chart-readout-time-separator">:</span>');
    }

    function formatChartTemperature(value) {
        if (!Number.isFinite(value)) {
            return '---';
        }
        return Math.abs(value - Math.round(value)) < 0.05 ? String(Math.round(value)) : value.toFixed(1);
    }

    function hasTempAtIndex(index) {
        const temp = temps[index];
        return temp !== undefined && temp !== null && Number.isFinite(temp);
    }

    function hasCapturedTempAtIndex(index) {
        const temp = rawTemps[index];
        return temp !== undefined && temp !== null && Number.isFinite(temp);
    }

    function hasInterpolatedTempAtIndex(index) {
        return hasTempAtIndex(index) && !hasCapturedTempAtIndex(index);
    }

    function getTempPointRadius(index) {
        if (hasCapturedTempAtIndex(index)) {
            return 2.8;
        }
        return hasInterpolatedTempAtIndex(index) ? 2.3 : 0;
    }

    function segmentUsesInterpolatedPoint(context) {
        const startIndex = context.p0DataIndex;
        const endIndex = context.p1DataIndex;
        return hasTempAtIndex(startIndex)
            && hasTempAtIndex(endIndex)
            && (!hasCapturedTempAtIndex(startIndex) || !hasCapturedTempAtIndex(endIndex));
    }

    function showChartReadout(index) {
        if (!hasTempAtIndex(index)) {
            hideChartReadout();
            return;
        }

        const pointTime = labels[index] !== undefined ? labels[index] : index * dataInterval;
        chartReadoutTime.innerHTML = formatTimeWithLightSeparator(pointTime);
        chartReadoutTemp.textContent = formatChartTemperature(temps[index]);
        chartReadout.classList.add('is-visible');
    }

    function hideChartReadout() {
        chartReadout.classList.remove('is-visible');
    }

    function hidePointDeletePanel() {
        pendingDeletePointIndex = null;
        pointDeletePanel.hidden = true;
    }

    function showPointDeletePanel(index) {
        if (!hasCapturedTempAtIndex(index)) {
            hidePointDeletePanel();
            return;
        }

        pendingDeletePointIndex = index;
        const pointTime = labels[index] !== undefined ? labels[index] : index * dataInterval;
        pointDeleteText.innerText = `${formatTime(pointTime)} / ${rawTemps[index].toFixed(1)}℃`;
        pointDeletePanel.hidden = false;
    }

    function handleChartClick(event, elements = []) {
        const tempElement = elements.find((element) => element.datasetIndex === 1 && hasTempAtIndex(element.index));
        if (!tempElement) {
            hideChartReadout();
            hidePointDeletePanel();
            return;
        }

        showChartReadout(tempElement.index);
        if (historyViewerEntryId) {
            hidePointDeletePanel();
            return;
        }
        if (hasCapturedTempAtIndex(tempElement.index)) {
            showPointDeletePanel(tempElement.index);
        } else {
            hidePointDeletePanel();
        }
    }

    function deleteCapturedPoint(index) {
        if (!hasCapturedTempAtIndex(index)) {
            return false;
        }

        const deletedTemp = rawTemps[index];
        const pointTime = labels[index] !== undefined ? labels[index] : index * dataInterval;
        rawTemps[index] = null;
        hideChartReadout();
        rebuildInterpolatedTemps();
        updateCrackInfo();
        roastChart.update();
        addLog(pointTime, `🧹 Deleted ${deletedTemp.toFixed(1)}℃`);
        return true;
    }

    function getElapsedRoastSeconds() {
        if (!roastStartedAt) {
            return currentSeconds;
        }
        return Math.max(0, Math.floor((Date.now() - roastStartedAt.getTime()) / 1000));
    }

    function markSampleSlot(slotIndex) {
        const slotSeconds = slotIndex * cueInterval;
        const dataIndex = slotSeconds / dataInterval;
        latestTargetTime = slotSeconds;
        if (rawTemps[dataIndex] === undefined) {
            rawTemps[dataIndex] = null;
            temps[dataIndex] = null;
            rors[dataIndex] = null;
        }
    }

    function updateClock() {
        currentSeconds = getElapsedRoastSeconds();
        timerDisplay.innerText = formatTime(currentSeconds);
        updateCrackInfo();
        updateXAxisMax(currentSeconds);

        const currentSlotIndex = Math.floor(currentSeconds / cueInterval);
        if (currentSlotIndex > lastProcessedSlotIndex) {
            for (let slotIndex = lastProcessedSlotIndex + 1; slotIndex <= currentSlotIndex; slotIndex++) {
                markSampleSlot(slotIndex);
            }
            lastProcessedSlotIndex = currentSlotIndex;
            roastChart.update();
            void playCue();
        }
    }

    function addLog(time, msg) {
        const div = document.createElement('div');
        div.innerHTML = `<span>[${formatTime(time)}]</span> ${msg}`;
        logDiv.appendChild(div);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {

            }
        } catch (error) {
            addLog(0, '⚠️ Wake Lockを取得できませんでした');

    function releaseWakeLock() {

    function parseWeight(input) {
        const value = parseFloat(input.value);
        return Number.isFinite(value) ? value : null;
    }

    function updateWeightLossDisplay() {
        const greenWeight = parseWeight(greenWeightInput);
        const roastedWeight = parseWeight(roastedWeightInput);

        weightLossDisplay.classList.remove('is-warning');

        if (greenWeight === null || greenWeight <= 0 || roastedWeight === null || roastedWeight < 0) {
            weightLossDisplay.innerText = '--.-%';
            if (roastPhase < 3) {
                weightLossMeta.innerText = '焙煎前の投入量を入れ、STOP後に焙煎後重量を入力してください。';
            } else {
                weightLossMeta.innerText = '焙煎後重量を入力すると重量減少率を自動計算します。';
            }
            return null;
        }

        const lossGrams = greenWeight - roastedWeight;
        const lossPercent = (lossGrams / greenWeight) * 100;
        weightLossDisplay.innerText = `${lossPercent.toFixed(1)}%`;

        if (lossGrams < 0) {
            weightLossDisplay.classList.add('is-warning');
            weightLossMeta.innerText = `焙煎後の方が ${Math.abs(lossGrams).toFixed(1)}g 重くなっています。`;
        } else {
            weightLossMeta.innerText = `${lossGrams.toFixed(1)}g 減少`;
        }

        return lossPercent;
    }

    function updateWeightInputsState() {

    function updateConditionalPanels() {

    function setActionButton(label, className, iconPath) {

    function resetChartState() {

    function escapeCsvCell(value) {
        const stringValue = value === null || value === undefined ? '' : String(value);
        if (stringValue.includes(',') || stringValue.includes('"') || stringValue.includes('\n')) {
            return `"${stringValue.replace(/"/g, '""')}"`;
        }
        return stringValue;
    }

    function formatNumber(value) {
        return value === null || value === undefined || Number.isNaN(value) ? '' : value.toFixed(1);
    }

    function buildTimestampForFilename(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${year}${month}${day}-${hours}${minutes}${seconds}`;
    }

    function createHistoryId() {

    function loadRoastHistory() {

        roastHistory = Array.isArray(savedHistory) ? savedHistory.filter((entry) => entry && entry.id) : [];
    }

    }

    function formatHistoryDateTime(value) {
        if (!value) {
            return '--/-- --:--';
        }
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return '--/-- --:--';
        }
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${month}/${day} ${hours}:${minutes}`;
    }

    function formatHistoryDuration(seconds) {
        const safeSeconds = Math.max(0, Math.round(Number(seconds) || 0));
        return `${Math.floor(safeSeconds / 60)}m${String(safeSeconds % 60).padStart(2, '0')}s`;
    }

    function formatHistoryLoss(value) {

    }

    function createRoastHistoryEntry() {

        const weightLossPercent = updateWeightLossDisplay();
        const beanMetadata = getBeanMetadata();
        const sampleCount = Math.min(labels.length, Math.floor(durationSeconds / dataInterval) + 1);

        return {

            startedAt: roastStartedAt ? roastStartedAt.toISOString() : '',
            stoppedAt: roastStoppedAt ? roastStoppedAt.toISOString() : '',
            beanName: beanMetadata.beanName || 'Untitled roast',
            durationSec: durationSeconds,
            weightLossPercent,
            labels: labels.slice(0, sampleCount),
            rawTemps: rawTemps.slice(0, sampleCount),
            temps: temps.slice(0, sampleCount),

    function addRoastHistoryEntry(entry) {
        if (!entry || !entry.id) {
            return;
        }
        roastHistory = [entry, ...roastHistory.filter((item) => item.id !== entry.id)].slice(0, 40);
        if (selectedHistoryIds.length === 0) {
            selectedHistoryIds = [entry.id];
        }

        renderRoastHistory();
    }

    function parseCsvLine(line) {
        const result = [];
        let current = '';
        let quoted = false;
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                if (quoted && line[i + 1] === '"') {
                    current += '"';
                    i++;
                } else {
                    quoted = !quoted;
                }
            } else if (char === ',' && !quoted) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current);
        return result;
    }

    function createHistoryEntryFromCsv(text, fileName) {
        const metadata = {};
        const importedLabels = [];
        const importedReference = [];
        const importedTemps = [];
        const importedRawTemps = [];
        const importedRors = [];
        let dataHeader = null;

        String(text).replace(/^\uFEFF/, '').split(/\r?\n/).forEach((line, index) => {
            if (line.trim() === '') {
                return;
            }

            const cells = parseCsvLine(line);
            if (cells[0] === 'time_sec') {
                dataHeader = cells;
                return;
            }

            if (dataHeader) {
                const row = Object.fromEntries(dataHeader.map((key, cellIndex) => [key, cells[cellIndex] || '']));
                const second = parseInt(row.time_sec || '', 10);
                if (!Number.isFinite(second)) {
                    return;
                }
                const targetTemp = parseFloat(row.target_temp_c || '');
                const actualTemp = parseFloat(row.actual_temp_c || '');
                const rorValue = parseFloat(row.ror_c_per_min || '');
                importedLabels.push(second);
                importedReference.push(Number.isFinite(targetTemp) ? targetTemp : null);
                importedTemps.push(Number.isFinite(actualTemp) ? actualTemp : null);
                importedRawTemps.push(row.data_source !== 'interpolated' && Number.isFinite(actualTemp) ? actualTemp : null);
                importedRors.push(Number.isFinite(rorValue) ? rorValue : null);
                return;
            }

            if (index === 0) {
                return;
            }
            const [key, value] = cells;
            if (key) {
                metadata[key] = value || '';
            }
        });

        const importedDuration = parseInt(metadata.roast_duration_sec || '0', 10)
            || importedLabels[importedLabels.length - 1]
            || 0;

        return {
            id: createHistoryId(),
            createdAt: new Date().toISOString(),
            startedAt: metadata.roast_started_at || metadata.exported_at || '',
            stoppedAt: metadata.roast_stopped_at || '',
            beanName: metadata.bean_name || fileName.replace(/\.csv$/i, '') || 'Imported roast',
            durationSec: importedDuration,
            weightLossPercent: metadata.weight_loss_percent !== undefined && metadata.weight_loss_percent !== ''
                ? parseFloat(metadata.weight_loss_percent)
                : null,
            labels: importedLabels,
            rawTemps: importedRawTemps,
            temps: importedTemps,
            rors: importedRors,
            referenceProfile: importedReference,
            crackSeconds: metadata.crack_time_sec !== undefined && metadata.crack_time_sec !== ''
                ? parseInt(metadata.crack_time_sec, 10)
                : null,
            crackTemp: metadata.crack_temp_c !== undefined && metadata.crack_temp_c !== ''
                ? parseFloat(metadata.crack_temp_c)
                : null
        };
    }

    function normalizeHistoryNumberArray(values) {
        return Array.isArray(values)
            ? values.map((value) => {
                const number = Number(value);
                return Number.isFinite(number) ? number : null;
            })
            : [];
    }

    function normalizeHistoryLabels(entry) {
        if (Array.isArray(entry.labels) && entry.labels.length > 0) {
            return entry.labels.map((value, index) => {
                const number = Number(value);
                return Number.isFinite(number) ? number : index * dataInterval;
            });
        }

        const durationSeconds = Math.max(defaultChartMaxSeconds, Number(entry.durationSec) || 0);
        const fallbackLabels = [];
        for (let t = 0; t <= durationSeconds; t += dataInterval) {
            fallbackLabels.push(t);
        }
        return fallbackLabels;
    }

    function getLatestFiniteValue(values) {
        for (let i = values.length - 1; i >= 0; i--) {
            if (Number.isFinite(values[i])) {
                return values[i];
            }
        }
        return null;
    }

    function getHistoryEntryById(historyId) {
        return roastHistory.find((entry) => entry.id === historyId) || null;
    }

    function showHistoryViewer(entry) {
        if (!entry || roastPhase !== 0 || isRoasting) {
            return;
        }

        const historyLabels = normalizeHistoryLabels(entry);
        const historyTemps = normalizeHistoryNumberArray(entry.temps);
        const historyRawTemps = normalizeHistoryNumberArray(entry.rawTemps);
        const historyRors = normalizeHistoryNumberArray(entry.rors);
        const historyReference = normalizeHistoryNumberArray(entry.referenceProfile);
        const maxSecond = Math.max(defaultChartMaxSeconds, Number(entry.durationSec) || historyLabels[historyLabels.length - 1] || 0);
        const latestTemp = getLatestFiniteValue(historyTemps);
        const latestRor = getLatestFiniteValue(historyRors);

        historyViewerEntryId = entry.id;
        document.body.classList.add('history-viewing');
        historyViewerBanner.hidden = false;
        historyViewerTitle.textContent = entry.beanName || 'Untitled roast';
        historyViewerMeta.textContent = `${formatHistoryDateTime(entry.startedAt || entry.createdAt)} · ${formatHistoryDuration(entry.durationSec)}`;

        hidePointDeletePanel();
        hideChartReadout();
        labels.length = 0;
        labels.push(...historyLabels);
        rawTemps.length = 0;
        rawTemps.push(...historyRawTemps);
        temps.length = 0;
        temps.push(...historyTemps);
        rors.length = 0;
        rors.push(...historyRors);

        roastChart.data.labels = labels;
        roastChart.data.datasets[0].data = historyReference;
        roastChart.data.datasets[1].data = temps;
        roastChart.data.datasets[2].data = rors;
        roastChart.options.scales.x.max = computeChartMaxSeconds(maxSecond);
        roastChart.options.plugins.annotation.annotations = {};
        const crackSecond = Number(entry.crackSeconds);
        const crackTemperature = Number(entry.crackTemp);
        if (Number.isFinite(crackSecond)) {
            roastChart.options.plugins.annotation.annotations.crackLine = {
                type: 'line',
                xMin: crackSecond,
                xMax: crackSecond,
                borderColor: '#e67e22',
                borderWidth: 2,
                borderDash: [4, 4],
                label: { content: '1C', display: true, position: 'start' }
            };
        }
        roastChart.update();

        timerDisplay.innerText = formatTime(entry.durationSec || maxSecond);
        tempDisplay.innerText = latestTemp !== null ? formatChartTemperature(latestTemp) : '---';
        rorDisplay.innerText = latestRor !== null ? latestRor.toFixed(1) : '--.-';
        crackInfo.hidden = !Number.isFinite(crackSecond);
        if (Number.isFinite(crackSecond)) {
            crackTimeBottom.innerText = formatTime(Math.max((entry.durationSec || 0) - crackSecond, 0));
            crackTempRise.innerText = Number.isFinite(crackTemperature) && latestTemp !== null
                ? `${latestTemp - crackTemperature > 0 ? '+' : ''}${(latestTemp - crackTemperature).toFixed(1)}`
                : '--.-';
        }
        postRoastFields.hidden = true;
    }

    function exitHistoryViewer() {
        if (!historyViewerEntryId) {
            return;
        }
        historyViewerEntryId = '';
        document.body.classList.remove('history-viewing');
        historyViewerBanner.hidden = true;
        resetUI(false);
        renderRoastHistory();
    }

    function renderRoastHistory() {
        if (!historyList) {
            return;
        }

        if (roastHistory.length > 0 && selectedHistoryIds.length === 0) {
            selectedHistoryIds = [roastHistory[0].id];
        }

        historyCompareToggle.classList.toggle('is-on', historyCompareMode);
        historyList.innerHTML = '';

        if (roastHistory.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'history-empty';
            empty.textContent = 'No logs';
            historyList.appendChild(empty);
            return;
        }

        roastHistory.forEach((entry) => {
            const selectedIndex = selectedHistoryIds.indexOf(entry.id);
            const isSelected = selectedIndex !== -1;
            const isViewing = entry.id === historyViewerEntryId;
            const markText = isSelected ? (historyCompareMode ? selectedIndex + 1 : '✓') : '';
            const button = document.createElement('button');
            button.className = `history-card${isSelected ? ' is-selected' : ''}${isViewing ? ' is-viewing' : ''}`;
            button.type = 'button';
            button.setAttribute('data-history-id', entry.id);
            button.innerHTML = `
                <span class="history-card-mark">${markText}</span>
                <span class="history-card-top">${escapeHtml(formatHistoryDateTime(entry.startedAt || entry.createdAt))}</span>
                <span class="history-card-bean">${escapeHtml(entry.beanName || 'Untitled roast')}</span>
                <span class="history-card-meta">${escapeHtml(formatHistoryDuration(entry.durationSec))} · ${escapeHtml(formatHistoryLoss(entry.weightLossPercent))}</span>
            `;
            button.addEventListener('click', () => selectHistoryEntry(entry.id));
            historyList.appendChild(button);
        });
    }

    function selectHistoryEntry(historyId) {
        if (historyCompareMode) {
            if (selectedHistoryIds.includes(historyId)) {
                selectedHistoryIds = selectedHistoryIds.filter((id) => id !== historyId);
            } else {
                selectedHistoryIds = [...selectedHistoryIds.slice(-1), historyId].slice(-2);
            }
        } else {
            selectedHistoryIds = [historyId];
            showHistoryViewer(getHistoryEntryById(historyId));
            setHistoryPanelOpen(false);
        }
        renderRoastHistory();
    }

    function setHistoryPanelOpen(isOpen) {
        if (isDesktopLayout()) {
            historyPanel.classList.remove('is-open');
            historyPanel.setAttribute('aria-hidden', 'false');
            historyScrim.hidden = true;
            return;
        }
        historyPanel.classList.toggle('is-open', isOpen);
        historyPanel.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
        historyScrim.hidden = !isOpen;
    }

    function canOpenHistoryPanel() {
        return !isDesktopLayout() && roastPhase === 0 && profileEditor.style.display !== 'block';
    }

    function shouldIgnoreHistorySwipeTarget(target) {
        return Boolean(target.closest('input, textarea, select, button, #profileEditor, .history-panel'));
    }

    function handleHistorySwipeStart(event) {
        if (!canOpenHistoryPanel() || historyPanel.classList.contains('is-open')) {
            return;
        }
        if (event.clientX > 24 || shouldIgnoreHistorySwipeTarget(event.target)) {
            return;
        }
        historySwipeStart = {
            x: event.clientX,
            y: event.clientY,
            pointerId: event.pointerId
        };
    }

    function handleHistorySwipeEnd(event) {
        if (!historySwipeStart || event.pointerId !== historySwipeStart.pointerId) {
            return;
        }
        const deltaX = event.clientX - historySwipeStart.x;
        const deltaY = event.clientY - historySwipeStart.y;
        historySwipeStart = null;

        if (deltaX > 72 && Math.abs(deltaX) > Math.abs(deltaY) * 1.25) {
            loadRoastHistory();
            renderRoastHistory();
            setHistoryPanelOpen(true);
        }
    }

    function handleHistorySwipeCancel() {
        historySwipeStart = null;
    }

    function importHistoryCsv(file) {
        if (!file) {
            return;
        }
        const reader = new FileReader();
        reader.addEventListener('load', () => {
            addRoastHistoryEntry(createHistoryEntryFromCsv(String(reader.result || ''), file.name));
        });
        reader.readAsText(file);
    }

    function calculateDataQuality(sampleCount) {
        let capturedPoints = 0;
        let interpolatedPoints = 0;
        let missedSlots = 0;

        for (let i = 0; i < sampleCount; i++) {
            if (rawTemps[i] !== undefined && rawTemps[i] !== null) {
                capturedPoints++;
            } else if (temps[i] !== undefined && temps[i] !== null) {
                interpolatedPoints++;
            } else {
                missedSlots++;
            }
        }

        return {
            capturedPoints,
            interpolatedPoints,
            missedSlots,
            rejectedOutliers: dataQuality.rejectedOutliers
        };
    }

    function exportCSV() {
        const exportedAt = new Date();
        const greenWeight = parseWeight(greenWeightInput);
        const roastedWeight = parseWeight(roastedWeightInput);
        const weightLossPercent = updateWeightLossDisplay();
        const durationSeconds = roastStopSeconds ?? Math.max(currentSeconds, 0);
        const sampleCount = Math.min(labels.length, Math.floor(durationSeconds / dataInterval) + 1);
        const qualitySummary = calculateDataQuality(sampleCount);
        const beanMetadata = getBeanMetadata();

        const rows = [
            ['item', 'value'],
            ['exported_at', exportedAt.toISOString()],
            ['roast_started_at', roastStartedAt ? roastStartedAt.toISOString() : ''],
            ['roast_stopped_at', roastStoppedAt ? roastStoppedAt.toISOString() : ''],
            ['bean_name', beanMetadata.beanName],
            ['note', beanMetadata.note],
            ['roast_duration_sec', durationSeconds],
            ['roast_duration', formatTime(durationSeconds)],
            ['bottom_time_sec', bottomTempIndex !== null ? labels[bottomTempIndex] : ''],
            ['bottom_time', bottomTempIndex !== null ? formatTime(labels[bottomTempIndex]) : ''],
            ['bottom_temp_c', bottomTempIndex !== null ? formatNumber(rawTemps[bottomTempIndex]) : ''],
            ['crack_time_sec', crackSeconds !== null ? crackSeconds : ''],
            ['crack_time', crackSeconds !== null ? formatTime(crackSeconds) : ''],
            ['crack_temp_c', crackTemp !== null ? formatNumber(crackTemp) : ''],
            ['green_weight_g', greenWeight !== null ? formatNumber(greenWeight) : ''],
            ['roasted_weight_g', roastedWeight !== null ? formatNumber(roastedWeight) : ''],
            ['weight_loss_percent', weightLossPercent !== null ? weightLossPercent.toFixed(1) : ''],
            ['captured_points', qualitySummary.capturedPoints],
            ['interpolated_points', qualitySummary.interpolatedPoints],
            ['missed_slots', qualitySummary.missedSlots],
            ['rejected_outliers', qualitySummary.rejectedOutliers],
            [],
            ['time_sec', 'time_label', 'target_temp_c', 'actual_temp_c', 'ror_c_per_min', 'is_crack', 'data_source']
        ];

        for (let i = 0; i < sampleCount; i++) {
            const second = labels[i];
            const dataSource = rawTemps[i] !== undefined && rawTemps[i] !== null
                ? 'captured'
                : temps[i] !== undefined && temps[i] !== null
                    ? 'interpolated'
                    : '';
            rows.push([
                second,
                formatTime(second),
                referenceProfile[i] !== undefined ? formatNumber(referenceProfile[i]) : '',
                temps[i] !== undefined && temps[i] !== null ? formatNumber(temps[i]) : '',
                rors[i] !== undefined && rors[i] !== null ? formatNumber(rors[i]) : '',
                crackSeconds !== null && second === crackSeconds ? '1' : '',
                dataSource
            ]);
        }

        const csv = `\uFEFF${rows.map((row) => row.map(escapeCsvCell).join(',')).join('\n')}`;
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `roast_log_${buildTimestampForFilename(exportedAt)}.csv`;
        link.click();
        URL.revokeObjectURL(url);
    }

    async function startRoast() {
        if (historyViewerEntryId) {
            exitHistoryViewer();
        }
        hidePointDeletePanel();
        hideChartReadout();
        isRoasting = true;
        currentSeconds = 0;
        lastProcessedSlotIndex = -1;
        crackSeconds = null;
        crackTemp = null;
        latestRecordedTemp = null;
        bottomTempIndex = null;
        roastStartedAt = new Date();
        roastStoppedAt = null;
        roastStopSeconds = null;
        dataQuality = {
            rejectedOutliers: 0
        };

        labels.length = 0;
        rawTemps.length = 0;
        temps.length = 0;
        rors.length = 0;

        logDiv.innerHTML = '';
        tempDisplay.innerText = '---';
        rorDisplay.innerText = '--.-';
        crackTimeBottom.innerText = '--:--';
        crackTempRise.innerText = '--.-';
        const baseMaxSec = computeChartMaxSeconds(getCurrentChartBaseSeconds());
        syncLabelsToRange(baseMaxSec);
        roastChart.options.scales.x.max = baseMaxSec;
        roastChart.options.plugins.annotation.annotations = {};
        roastChart.update();

        setActionButton('CRACK', 'btn-crack', 'M12 23c-5.52 0-10-4.48-10-10 0-4.75 5.07-8.12 6.19-8.82.41-.26.95-.12 1.19.31.23.42.14.95-.21 1.28-1.5 1.4-2.17 3.39-2.17 5.23 0 3.87 3.13 7 7 7s7-3.13 7-7c0-2.38-1.39-4.83-3.05-6.14-.42-.33-.5-.94-.19-1.37.31-.43.91-.53 1.35-.23C21.05 4.54 22 7.11 22 10c0 5.52-4.48 10-10 10z');
        roastPhase = 1;
        updateWeightInputsState();
        updateConditionalPanels();
        applyCueSettingsToUI();

        await primeAudioOutput();

        await requestWakeLock();
        if (recognition) {
            try {
                recognition.start();
            } catch (error) {
                addLog(0, '⚠️ 音声認識を開始できませんでした');
            }
        } else {
            addLog(0, '⚠️ このブラウザでは音声認識が使えません');
        }

        updateClock();
        timerInterval = setInterval(updateClock, 1000);
    }

    function markCrack() {
        currentSeconds = getElapsedRoastSeconds();
        crackSeconds = Math.max(currentSeconds, 0);
        crackTemp = latestRecordedTemp || 0;
        roastChart.options.plugins.annotation.annotations = {
            crackLine: {
                type: 'line',
                xMin: crackSeconds,
                xMax: crackSeconds,
                borderColor: 'rgba(230, 126, 34, 0.5)',
                borderWidth: 2
            }
        };
        roastChart.update();
        updateCrackInfo();

        setActionButton('STOP', 'btn-stop', 'M6 6h12v12H6z');
        roastPhase = 2;
        updateConditionalPanels();
    }

    function stopRoast() {
        isRoasting = false;
        currentSeconds = getElapsedRoastSeconds();
        clearInterval(timerInterval);
        timerInterval = null;
        roastStoppedAt = new Date();
        roastStopSeconds = Math.max(currentSeconds, 0);
        if (recognition) {
            recognition.stop();
        }
        releaseWakeLock();
        updateCrackInfo();

        setActionButton('SAVE', 'btn-save', 'M19 9h-4V3H9v6H5l7 7 7-7zm-14 9v2h14v-2H5z');
        roastPhase = 3;
        updateWeightInputsState();
        updateConditionalPanels();
        applyCueSettingsToUI();
        roastedWeightInput.focus();
    }

    function saveRoast() {
        if (saveInProgress) {
            return;
        }
        saveInProgress = true;
        mainActionBtn.disabled = true;
        try {
            const historyEntry = createRoastHistoryEntry();
            exportCSV();
            addRoastHistoryEntry(historyEntry);
            resetUI(true);
            lockMainAction(800);
        } catch (error) {
            addLog(Math.max(currentSeconds, 0), '⚠️ CSV exportに失敗しました');
            mainActionBtn.disabled = false;
        } finally {
            saveInProgress = false;
        }
    }

    greenWeightInput.addEventListener('input', updateWeightLossDisplay);
    roastedWeightInput.addEventListener('input', updateWeightLossDisplay);
    beepEnabledInput.addEventListener('change', saveCueSettings);
    cueIntervalInput.addEventListener('change', saveCueSettings);
    hapticEnabledInput.addEventListener('change', saveCueSettings);
    beanNameInput.addEventListener('input', saveBeanMetadata);
    beanNoteInput.addEventListener('input', saveBeanMetadata);
    beanSuggestionButtons.forEach((button) => {
        button.addEventListener('click', () => {
            applyBeanSuggestion(button.getAttribute('data-bean-suggestion'));
        });
    });
    historyCompareToggle.addEventListener('click', () => {
        historyCompareMode = !historyCompareMode;
        if (!historyCompareMode && selectedHistoryIds.length > 1) {
            selectedHistoryIds = [selectedHistoryIds[0]];
        }
        renderRoastHistory();
    });
    historyImportBtn.addEventListener('click', () => historyImportInput.click());
    historyImportInput.addEventListener('change', () => {
        importHistoryCsv(historyImportInput.files?.[0]);
        historyImportInput.value = '';
    });
    historyExitViewerBtn.addEventListener('click', exitHistoryViewer);
    historyScrim.addEventListener('click', () => setHistoryPanelOpen(false));
    cancelDeletePointBtn.addEventListener('click', hidePointDeletePanel);
    confirmDeletePointBtn.addEventListener('click', () => {
        if (pendingDeletePointIndex !== null) {
            deleteCapturedPoint(pendingDeletePointIndex);
        }
        hidePointDeletePanel();
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            hidePointDeletePanel();
            setHistoryPanelOpen(false);
        }
    });
    document.addEventListener('pointerdown', handleHistorySwipeStart, { passive: true });
    document.addEventListener('pointerup', handleHistorySwipeEnd, { passive: true });
    document.addEventListener('pointercancel', handleHistorySwipeCancel, { passive: true });
    testCueBtn.addEventListener('click', async () => {
        await primeAudioOutput();
        await playCue();
    });

    ['pointerdown', 'touchend', 'keydown'].forEach((eventName) => {
        window.addEventListener(eventName, () => {
            void primeAudioOutput();
        }, { once: true });
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && isRoasting) {
            void primeAudioOutput();
        }
    });

    mainActionBtn.addEventListener('click', async () => {
        if (isMainActionLocked()) {
            return;
        }
        if (roastPhase === 0) {
            await startRoast();
        } else if (roastPhase === 1) {
            markCrack();
        } else if (roastPhase === 2) {
            stopRoast();
        } else if (roastPhase === 3) {
            saveRoast();
        }
    });

    loadRoastHistory();
    renderRoastHistory();
    applyDesktopLayoutState();
    resetUI(false);
</script>
</body>
</html>
